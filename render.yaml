# One Render web service. No separate database.
# SQLite lives on the service disk and is wiped when Render restarts or redeploys.
services:
  - type: web
    name: sahara
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:../data/sahara.sqlite
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTIFY_CHANNEL
        value: telegram
      - key: DEMO_MODE
        value: "false"
